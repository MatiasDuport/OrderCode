[package]
name = "ordercode-desktop"
version = "0.3.6"
description = "OrderCode desktop shell and native broker"
authors = ["OrderCode"]
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
ring = "0.17"
reqwest = { version = "0.13", features = ["json"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = "4.2"
tauri-plugin-dialog = "2"
portable-pty = "0.9"
tauri-plugin-updater = "2"
